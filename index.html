<title>ζ(½ + it)</title>

<main>

    </figure>

    <p class="note">Each time the output curve passes through 0, that zero ρ = ½ + iγ (with its conjugate) adds the wave −2 Re li(x<sup>ρ</sup>) to Riemann's explicit formula, and the curve moves closer to the true staircase. Off the line σ = ½ the curve never hits 0, so no harmonics are added.</p>

<script>
// ---- ζ(s) by Euler–Maclaurin summation ----
const EM = [1/12, -1/720, 1/30240, -1/1209600, 1/47900160, -691/1307674368000, 1/74724249600];
function zeta(sr, si) {
  const N = Math.max(10, Math.ceil((Math.abs(si) + 20) / Math.PI));
  let re = 0, im = 0;
  for (let n = 1; n < N; n++) {
    const l = Math.log(n), m = Math.exp(-sr * l), a = -si * l;
    re += m * Math.cos(a); im += m * Math.sin(a);
  }
  const lN = Math.log(N), mA = Math.exp(-sr * lN), aA = -si * lN;
  const Ar = mA * Math.cos(aA), Ai = mA * Math.sin(aA);
  const nr = N * Ar, ni = N * Ai, dr = sr - 1, di = si, dd = dr * dr + di * di;
  re += (nr * dr + ni * di) / dd; im += (ni * dr - nr * di) / dd;
  re += Ar / 2; im += Ai / 2;
  let Pr = sr, Pi = si, pw = 1 / N;
  for (let k = 1; k <= EM.length; k++) {
    if (k > 1) {
      for (const j of [2 * k - 3, 2 * k - 2]) {
        const xr = sr + j, r = Pr * xr - Pi * si; Pi = Pr * si + Pi * xr; Pr = r;
      }
      pw /= N * N;
    }
    re += EM[k - 1] * pw * (Pr * Ar - Pi * Ai);
    im += EM[k - 1] * pw * (Pr * Ai + Pi * Ar);
  }
  return [re, im];
}

    ctx.globalAlpha = 0.25 + 0.75 * ((j - start) / Math.max(1, n - start));
    ctx.lineWidth = 1.2 + 1.3 * ((j - start) / Math.max(1, n - start));
    ctx.beginPath(); ctx.moveTo(X(curve[i][0]), Y(curve[i][1]));
    for (let q = i + 1; q <= j; q++) ctx.lineTo(X(curve[q][0]), Y(curve[q][1]));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // flash at the origin for recent hits
  for (let i = hits - 1; i >= 0; i--) {
    const age = clock - hitAt[i]; if (age > FLASH) break;
    const p = age / FLASH, a = reduce ? (1 - p) : Math.sin(Math.PI * p);
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = k.zero; ctx.beginPath(); ctx.arc(X(0), Y(0), 7, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = k.zero; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X(0), Y(0), 7 + (reduce ? 6 : 22 * p), 0, 2 * Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // head
  const [hu, hv] = n >= 0 ? curve[n] : zeta(sigma, tCur);
  ctx.fillStyle = k.path; ctx.beginPath(); ctx.arc(X(hu), Y(hv), 5.5, 0, 2 * Math.PI); ctx.fill();
  return [hu, hv];
}

// ---- prime staircase ----
function drawStair(k, K) {
  const [ctx, w, h] = fit(stair);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 34, r: 10, t: 8, b: 24 };
  const yMax = piTrue[X_MAX] + 2, yMin = -1;
  const X = x => pad.l + (x - 1) / (X_MAX - 1) * (w - pad.l - pad.r);
  const Y = v => pad.t + (yMax - v) / (yMax - yMin) * (h - pad.t - pad.b);
  ctx.strokeStyle = k.grid; ctx.lineWidth = 1; ctx.fillStyle = k.muted; ctx.font = `12px ${k.mono}`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= yMax; v += 5) { ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke(); ctx.fillText(String(v), pad.l - 6, Y(v)); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let x = 10; x <= X_MAX; x += 10) { ctx.beginPath(); ctx.moveTo(X(x), pad.t); ctx.lineTo(X(x), h - pad.b); ctx.stroke(); ctx.fillText(String(x), X(x), h - pad.b + 6); }
  ctx.save(); ctx.beginPath(); ctx.rect(pad.l, pad.t, w - pad.l - pad.r, h - pad.t - pad.b); ctx.clip();
  // true staircase
  ctx.strokeStyle = k.truth; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(1), Y(0));
  for (let n = 2; n <= X_MAX; n++) if (piTrue[n] !== piTrue[n - 1]) { ctx.lineTo(X(n), Y(piTrue[n - 1])); ctx.lineTo(X(n), Y(piTrue[n])); }
  ctx.lineTo(X(X_MAX), Y(piTrue[X_MAX])); ctx.stroke();
  // R(x), no zeros
  ctx.setLineDash([5, 4]); ctx.strokeStyle = k.muted; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 0; i < S; i++) { i ? ctx.lineTo(X(xs[i]), Y(base[i])) : ctx.moveTo(X(xs[i]), Y(base[i])); }
  ctx.stroke(); ctx.setLineDash([]);
  // approximation with K harmonics
  const off = K * S; ctx.strokeStyle = k.path; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
  for (let i = 0; i < S; i++) { const v = base[i] + cum[off + i]; i ? ctx.lineTo(X(xs[i]), Y(v)) : ctx.moveTo(X(xs[i]), Y(v)); }
  ctx.stroke();
  ctx.restore();
  // worst error at half-integers (away from the jumps)
  let e = 0;
  for (let i = 0; i < S; i++) { const x = xs[i]; if (x < 2) continue; if (Math.abs(x - Math.floor(x) - 0.5) < 0.5 * (X_MAX - 1) / S) e = Math.max(e, Math.abs(base[i] + cum[off + i] - piTrue[Math.floor(x)])); }
  return e;
}

// ---- loop ----
const readout = document.getElementById('readout');
function frame(now) {
  if (last === null) last = now;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  clock += dt;
  extendCurve(Math.min(T_MAX, tCur + SPEED * 0.25 + 1), 8);
  if (playing) {
    if (tCur < T_MAX) {
      tCur = Math.min(T_MAX, tCur + SPEED * dt, (curve.length - 1) * DT);
      while (hits < zeros.length && zeros[hits] <= tCur) hitAt[hits++] = clock;
    } else if ((endTimer += dt) > END_HOLD) reset();
  }
  computeHarmonics(6);
  const k = tokens();
  drawInput(k);
  const [u, v] = drawOutput(k);
  const K = Math.min(hits, harmonicsReady);
  const err = drawStair(k, K);
  if (tCur > 1) minDist = Math.min(minDist, Math.hypot(u, v));
  readout.innerHTML = `t = <b>${tCur.toFixed(2).padStart(7, ' ')}</b> &nbsp; ζ = <b>${u.toFixed(3).replace('-', '−')} ${v < 0 ? '−' : '+'} ${Math.abs(v).toFixed(3)}i</b> &nbsp; closest to 0: <b>${minDist.toFixed(3)}</b> &nbsp; zeros: <b>${hits}</b> &nbsp; harmonics in π(x): <b>${K}</b>${K < hits ? ' (computing…)' : ''} &nbsp; worst error: <b>${err.toFixed(3)}</b>`;
  requestAnimationFrame(frame);
}
let minDist = Infinity;
function reset() { tCur = 0; endTimer = 0; hitAt.length = 0; hits = 0; minDist = Infinity; }
const sigLabel = x => x === 0.5 ? '½' : x.toFixed(2);
document.getElementById('sigma').addEventListener('input', e => {
  sigma = Math.round(parseFloat(e.target.value) * 100) / 100;
  zeros = sigma === 0.5 ? criticalZeros : [];
  buildCurve(); reset();
  const L = sigLabel(sigma);
  document.getElementById('sigval').textContent = L;
  document.getElementById('title').innerHTML = `ζ(${L} + <i>it</i>)`;
  document.getElementById('sform').innerHTML = `s = ${L} + <i>it</i>`;
});
document.getElementById('speed').addEventListener('input', e => {
  SPEED = speedOf(+e.target.value);
  document.getElementById('speedval').textContent = SPEED < 10 ? SPEED.toFixed(1) : Math.round(SPEED);
});
document.getElementById('pause').addEventListener('click', e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; });
document.getElementById('restart').addEventListener('click', () => { reset(); playing = true; document.getElementById('pause').textContent = 'Pause'; });
requestAnimationFrame(frame);
</script>
